[theme]
base = "dark"
primaryColor = "#5eead4"
backgroundColor = "#07101c"
secondaryBackgroundColor = "#101f36"
textColor = "#e8eef6"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Newsreader':https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["46px", "32px", "24px", "18px", "15px", "13px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
metricValueFontSize = "2rem"
metricValueFontWeight = 600
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = false
paddingTop = "1.2rem"
paddingBottom = "2.5rem"
chartCategoricalColors = ["#5eead4", "#8b9cff", "#f6c177", "#e78284", "#a6d189", "#c6a0f6"]

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
